[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "promo-finder"
version = "0.1.0"
description = "Find and rank social promos in timestamped microdrama screenplays."
requires-python = ">=3.10"
dependencies = [
  "openai>=1.40",
  "pydantic>=2.7",
  "pyyaml>=6",
  "python-dotenv>=1",
  "pandas>=2",
]

[project.optional-dependencies]
app = ["streamlit>=1.36"]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["promo_finder*"]

[tool.setuptools.package-data]
promo_finder = ["prompts/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
